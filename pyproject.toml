[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-llm-workspace"
version = "0.1.0"
description = "A local, human-guided workspace for comparing model responses."
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40,<2",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
